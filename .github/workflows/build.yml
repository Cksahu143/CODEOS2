name: Build CodeOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS 13 matches the app's minimum deployment target and ships with Xcode 14.x.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --show-sdk-path
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build CodeOS.app
        run: bash scripts/build-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CodeOS-app
          path: build/CodeOS.app
